<title>Livreto Você Sabe Descansar?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;700;800&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: um livreto de páginas únicas, lombada com as 4 faixas de cor da apresentação, uma página por etapa */
:root{
  --bg:#E9E6DA;          /* creme da apresentação */
  --page:#F6F4EC;
  --ink:#2F2E28;         /* oliva escuro */
  --ink-soft:#5E5C52;
  --line:#D6D2C3;
  --orange:#F4673B;      /* laranja dos slides */
  --orange-strong:#E2531F;
  --zoetis:#F65C00;
  --olive:#33322B;
  --peach:#FCD8C8;
  --chip:#EFEBDF;
  --on-orange:#FFFFFF;
  --good:#3F7D52;
  --shadow:0 1px 2px rgba(51,50,43,.08),0 12px 32px -12px rgba(51,50,43,.25);
  --f-display:"League Spartan","Montserrat",system-ui,sans-serif;
  --f-body:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#24231E;--page:#33322B;--ink:#F1EEE3;--ink-soft:#C9C5B6;--line:#4A4940;
  --orange:#F7784F;--orange-strong:#FF8A5E;--peach:#5A3A2C;--chip:#3D3C34;--good:#7CC08F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 40px -14px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#24231E;--page:#33322B;--ink:#F1EEE3;--ink-soft:#C9C5B6;--line:#4A4940;
  --orange:#F7784F;--orange-strong:#FF8A5E;--peach:#5A3A2C;--chip:#3D3C34;--good:#7CC08F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 40px -14px rgba(0,0,0,.6);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
h1,h2,h3{font-family:var(--f-display);line-height:1.05;text-wrap:balance;margin:0;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:6px}

.topbar{max-width:880px;margin:0 auto 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand .nbb{height:38px;width:auto;background:#fff;border-radius:6px;padding:3px 6px}
.brand .zo{height:30px;width:auto;border-radius:4px}
.brand small{font-size:12px;color:var(--ink-soft);line-height:1.3}
.steps{display:flex;gap:6px;list-style:none;margin:0;padding:0}
.steps li{width:30px;height:6px;border-radius:3px;background:var(--line);transition:background .3s}
.steps li.done{background:var(--orange)}
.steps li.now{background:var(--ink)}

/* livreto */
.book{max-width:880px;margin:0 auto;display:grid;grid-template-columns:22px 1fr;background:var(--page);
  border-radius:4px 14px 14px 4px;box-shadow:var(--shadow);overflow:hidden;min-height:560px}
.spine{display:grid;grid-template-rows:1fr 1fr 1fr 1fr}
.spine i:nth-child(1){background:#FFFFFF}.spine i:nth-child(2){background:#E9E6DA}
.spine i:nth-child(3){background:#F4673B}.spine i:nth-child(4){background:#33322B}
.page{min-width:0;padding:34px clamp(18px,5vw,52px) 28px;display:flex;flex-direction:column;gap:22px;animation:turn .45s ease}
@keyframes turn{from{opacity:.25;transform:translateX(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.page{animation:none}*{transition:none!important}}
.folio{display:flex;justify-content:space-between;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
.folio b{color:var(--orange)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--orange)}
.h-xl{font-size:clamp(40px,8vw,72px);font-weight:800}
.h-l{font-size:clamp(28px,5vw,42px);font-weight:800}
.h-m{font-size:21px;font-weight:700}
.lead{font-size:17px;color:var(--ink-soft);max-width:60ch}
.hl{color:var(--orange)}
.nav{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--line)}
.btn{border:0;border-radius:999px;padding:13px 24px;font-weight:700;cursor:pointer;font-size:15px;transition:transform .15s,background .2s}
.btn-primary{background:var(--orange);color:var(--on-orange)}
.btn-primary:hover{background:var(--orange-strong)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--ink-soft);padding-inline:6px}
.btn-ghost:hover{color:var(--ink)}
.btn-dark{background:var(--olive);color:#F1EEE3}
:root[data-theme="dark"] .btn-dark{background:#F1EEE3;color:#33322B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn-dark{background:#F1EEE3;color:#33322B}}
.hint{font-size:13px;color:var(--ink-soft)}

/* capa */
.cover{position:relative;border-radius:10px;overflow:hidden;min-height:300px;background:#7a9a4a center/cover no-repeat;display:flex;align-items:flex-end}
.cover .tag{position:relative;margin:18px;display:flex;flex-direction:column;gap:6px;max-width:440px}
.cover .tag span{background:#E4531F;color:#fff;padding:6px 12px;display:inline-block;width:fit-content}
.cover .t1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,5vw,40px);line-height:1}
.cover .t2{font-weight:700;font-size:16px}
.cover .t3{font-style:italic;font-size:14px;background:rgba(228,83,31,.92)!important}
.notice{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;background:var(--chip);border-radius:10px;padding:16px 18px;font-size:13.5px;color:var(--ink-soft)}
.notice img{width:40px;height:40px;background:#fff;border-radius:6px;padding:4px}
.notice b{color:var(--ink)}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;list-style:none;padding:0;margin:0;counter-reset:s}
.howto li{counter-increment:s;font-size:13.5px;color:var(--ink-soft);display:flex;flex-direction:column;gap:4px;border-top:3px solid var(--orange);padding-top:10px}
.howto li::before{content:counter(s);font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--ink)}

/* escala */
.split{display:grid;grid-template-columns:1fr 200px;gap:28px;align-items:start}
.split > *{min-width:0}
.side-img{border-radius:10px;width:100%;aspect-ratio:3/4;object-fit:cover;max-width:100%}
.meter{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.meter .num{font-family:var(--f-display);font-weight:800;font-size:96px;line-height:.8;color:var(--orange);font-variant-numeric:tabular-nums;min-width:1.3ch}
.meter .lab{display:flex;flex-direction:column;gap:2px;padding-bottom:6px}
.meter .lab strong{font-size:20px;font-family:var(--f-display)}
.meter .lab span{color:var(--ink-soft);font-size:14px;max-width:38ch}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:999px;
  background:linear-gradient(90deg,#E9E6DA 0%,#F9B89E 35%,#F4673B 65%,#33322B 100%);outline-offset:6px;cursor:pointer;border:1px solid var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:var(--page);border:4px solid var(--orange);box-shadow:0 2px 8px rgba(0,0,0,.25)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--page);border:4px solid var(--orange)}
.ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;padding-inline:6px}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;font-size:12.5px}
.legend div{padding:8px 10px;border-radius:8px;background:var(--chip);color:var(--ink-soft);line-height:1.35}
.legend div b{display:block;color:var(--ink);font-size:13px}
.legend div.on{background:var(--peach);color:var(--ink)}

/* frentes */
.fronts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.front{text-align:left;border:2px solid var(--line);background:var(--page);border-radius:12px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:border-color .2s,background .2s,transform .15s;min-width:0}
.front:hover{border-color:var(--orange)}
.front[aria-pressed="true"]{border-color:var(--orange);background:var(--peach)}
.front .fh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.front .fh strong{font-family:var(--f-display);font-size:22px}
.front .sw{width:14px;height:14px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.15)}
.front ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink-soft);line-height:1.45}
.front .check{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:transparent;flex:none}
.front[aria-pressed="true"] .check{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:800;font-family:var(--f-display);font-size:14px}
.front:disabled{opacity:.45;cursor:not-allowed}
.front:disabled:hover{border-color:var(--line)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--line)}
.tab{border:0;background:transparent;padding:10px 14px;font-weight:700;cursor:pointer;color:var(--ink-soft);border-bottom:3px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:8px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--orange)}
.tab .o{font-family:var(--f-display);font-size:12px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--chip)}
.tab[aria-selected="true"] .o{background:var(--orange);color:#fff}
.fsec{display:flex;flex-direction:column;gap:22px}
.fintro{display:flex;flex-direction:column;gap:6px}
.fintro .h-m{font-size:24px}
.flist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.flist li{font-size:14px}.flist li b{font-family:var(--f-display);font-size:18px;margin-right:6px}

/* dicas */
.banner{display:grid;grid-template-columns:1fr 180px;border-radius:12px;overflow:hidden;background:var(--orange);color:#fff}
.banner > div{padding:22px 24px;display:flex;flex-direction:column;gap:8px;min-width:0}
.banner img{width:100%;height:100%;object-fit:cover;max-width:100%}
.banner .eyebrow{color:#33322B}
.banner p{font-size:14.5px}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;list-style:none;margin:0;padding:0}
.tips li{background:var(--chip);border-radius:10px;padding:14px 16px;font-size:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tips li b{font-family:var(--f-display);font-size:17px}
.tips li .src{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--orange);font-weight:700}
.pare{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-radius:12px;overflow:hidden}
.pare > div{padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0;font-size:13.5px}
.pare .L{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:.9}
.pare .n{font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.pare > div:nth-child(1){background:#FFFFFF;color:#2F2E28;border:1px solid var(--line)}
.pare > div:nth-child(2){background:#E9E6DA;color:#2F2E28}
.pare > div:nth-child(3){background:#F4673B;color:#fff}
.pare > div:nth-child(4){background:#33322B;color:#F1EEE3}
.alert{border-left:4px solid var(--orange);background:var(--peach);padding:14px 16px;border-radius:0 10px 10px 0;font-size:14px}
.alert b{display:block;font-family:var(--f-display);font-size:17px;margin-bottom:2px}
.pairs{display:grid;gap:8px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.3fr);gap:10px;align-items:center;font-size:14px;padding:8px 0;border-bottom:1px dashed var(--line)}
.pair .tag{font-size:11px;font-weight:700;letter-spacing:.08em;padding:3px 8px;border-radius:999px;text-transform:uppercase;white-space:nowrap}
.tag.R{background:#DDEBDD;color:#2E5E3B}.tag.E{background:#F6D3C5;color:#9A3410}.tag.D{background:#E7E3D4;color:#5E5C52}

/* prioridades */
.counter{font-family:var(--f-display);font-size:20px;font-weight:700}
.counter b{color:var(--orange);font-variant-numeric:tabular-nums}
.opts{display:flex;flex-direction:column;gap:18px}
.opt-group h3{font-size:14px;font-family:var(--f-body);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--page);border-radius:999px;padding:9px 15px;font-size:14px;cursor:pointer;text-align:left;transition:all .15s;max-width:100%}
.chip:hover{border-color:var(--orange)}
.chip[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:600}
.chip.rec{border-style:dashed;border-color:var(--orange)}
.chip.rec[aria-pressed="true"]{border-style:solid}
.chip:disabled{opacity:.4;cursor:not-allowed}
textarea{width:100%;min-height:84px;border:2px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;background:var(--page);color:var(--ink);resize:vertical}
textarea:focus{border-color:var(--orange);outline:none}

/* bem */
.celebrate{display:grid;grid-template-columns:1fr 220px;gap:26px;align-items:center}
.celebrate > *{min-width:0}
.keep{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;list-style:none;margin:0;padding:0}
.keep li{border-top:3px solid var(--orange);padding-top:10px;font-size:14px;color:var(--ink-soft)}
.keep li b{display:block;color:var(--ink);font-family:var(--f-display);font-size:18px}

/* plano */
.plan{border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.plan-head{background:#33322B center/cover no-repeat;color:#fff;padding:26px 24px 22px;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;position:relative}
.plan-head::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,30,40,.05),rgba(20,25,30,.65))}
.plan-head > *{position:relative}
.plan-head .eyebrow{color:#FCD8C8}
.plan-body{padding:22px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.plan-body > div{min-width:0}
.k{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;margin-bottom:4px}
.v{font-family:var(--f-display);font-size:22px;font-weight:700}
.v small{font-family:var(--f-body);font-size:13px;color:var(--ink-soft);font-weight:500;display:block}
.prio{margin:0;padding:0;list-style:none;counter-reset:p;display:flex;flex-direction:column;gap:8px}
.prio li{counter-increment:p;display:grid;grid-template-columns:28px 1fr;gap:8px;font-size:14.5px;align-items:baseline}
.prio li::before{content:counter(p);font-family:var(--f-display);font-weight:800;color:#fff;background:var(--orange);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-size:13px}
.quote{font-family:var(--f-display);font-size:clamp(20px,3.4vw,27px);font-weight:700;line-height:1.2;border-left:5px solid var(--orange);padding-left:16px;max-width:36ch}
.foot{max-width:880px;margin:18px auto 0;font-size:12px;color:var(--ink-soft);display:flex;gap:10px 24px;flex-wrap:wrap;justify-content:space-between}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--olive);color:#F1EEE3;padding:10px 18px;border-radius:999px;font-size:14px;z-index:20}
.copybox{width:100%;min-height:160px;font-size:13px}

@media (max-width:640px){
  .split,.celebrate,.banner{grid-template-columns:1fr}
  .side-img{aspect-ratio:16/9}
  .banner img{max-height:180px}
  .pare{grid-template-columns:1fr 1fr}
  .book{grid-template-columns:10px 1fr}
  .meter .num{font-size:76px}
  .pair{grid-template-columns:1fr auto}
  .pair > span:last-child{grid-column:1/-1;color:var(--ink-soft)}
  .brand small{display:none}
}

/* campos abertos e micropausas */
.reflect{display:flex;flex-direction:column;gap:8px;background:var(--chip);border-radius:12px;padding:16px 18px;border:1px dashed var(--line)}
.reflect > label,.reflect .lbl{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.25;display:flex;gap:8px;align-items:baseline}
.pen{color:var(--orange);font-size:16px}
.reflect textarea{background:var(--page);min-height:72px}
.mypare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mypare label{display:grid;grid-template-columns:30px 1fr;gap:4px 8px;align-items:center;font-size:13px;color:var(--ink-soft)}
.mypare .L{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--orange);grid-row:span 2}
.mypare input,.addrow input{width:100%;border:2px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit;font-size:14px;background:var(--page);color:var(--ink);min-width:0}
.mypare input:focus,.addrow input:focus{border-color:var(--orange);outline:none}
.light{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px;align-items:center;border:2px solid var(--orange);border-radius:12px;padding:18px 20px}
.light-head{display:flex;flex-direction:column;gap:4px}
.light-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.light-list li{display:flex;gap:10px;align-items:baseline;font-size:14.5px;font-weight:500}
.light-list li::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:var(--orange);transform:translateY(-1px)}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow input{flex:1 1 220px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.notes p{font-size:14px;margin-top:4px}
@media (max-width:640px){.mypare,.light{grid-template-columns:1fr}}
</style>

if(S.front){S.fronts=[S.front]}delete S.front;
["fronts","prios","custom"].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});
["reflex","meuPare"].forEach(k=>{if(!S[k]||typeof S[k]!=="object")S[k]={}});
const save=()=>{try{localStorage.setItem("nbb-descanso",JSON.stringify(S))}catch(e){}};
const good=()=>S.score<=2;
const flow=()=>good()?["capa","escala","bem","prioridades","plano"]:["capa","escala","frente","dicas","prioridades","plano"];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
const has=s=>String(s||"").trim().length>0;

function go(n){S.step=Math.max(0,Math.min(n,flow().length-1));save();render();window.scrollTo({top:0,behavior:"smooth"})}
function folio(title){const f=flow();return `<div class="folio"><span>Você sabe descansar?</span><span>Página <b>${S.step+1}</b> de ${f.length} · ${title}</span></div>`}
function nav(next,label,disabled){return `<div class="nav">${S.step>0?`<button class="btn btn-ghost" onclick="go(S.step-1)">← Voltar</button>`:`<span></span>`}<button class="btn btn-primary" id="next" ${disabled?"disabled":""} onclick="${next}">${label}</button></div>`}
/* campo aberto de reflexão; path = "notaEscala" ou "reflex.cognitivo" */
function field(id,path,label,ph,rows){const v=path.split(".").reduce((o,k)=>o?o[k]:"",S)||"";
  return `<div class="reflect"><label for="${id}"><span class="pen" aria-hidden="true">✎</span>${label}</label><textarea id="${id}" rows="${rows||3}" placeholder="${esc(ph)}" oninput="setPath('${path}',this.value)">${esc(v)}</textarea><span class="hint">Opcional. Escreva livremente: o objetivo é trazer para a consciência.</span></div>`}
function setPath(path,val){const ks=path.split(".");let o=S;for(let i=0;i<ks.length-1;i++){o[ks[i]]=o[ks[i]]||{};o=o[ks[i]]}o[ks[ks.length-1]]=val;save()}

const V={
capa:()=>`
  <div class="cover" style="background-image:url(${IMG.dog})"><div class="tag">
    <span class="t1">Livreto do Descanso</span>
    <span class="t2">Você sabe descansar?</span>
    <span class="t3">Sugestões para reconhecer seu cansaço e escolher como recuperar</span>
  </div></div>
  <p class="lead">Este livreto continua a conversa da palestra. Em poucos minutos você observa <b>quanto</b> está cansado, <b>que tipo</b> de cansaço aparece mais e monta um pequeno plano de descanso para os próximos dias. Tudo aqui é sugestão: você escolhe o que faz sentido e pode escrever com suas palavras.</p>
  <ol class="howto">
    <li>Marque sua escala de cansaço de 0 a 10.</li>
    <li>Escolha até 3 frentes em que o cansaço mais aparece.</li>
    <li>Veja sugestões tiradas do conteúdo da palestra, das mais simples às mais completas.</li>
    <li>Escolha ou escreva 3 prioridades de descanso e leve seu plano.</li>
  </ol>
  <div class="notice"><img src="${IMG.icone}" alt=""><p><b>Importante:</b> esta ferramenta não é científica nem faz diagnóstico. Ela faz parte do trabalho do Programa Bem-Estar e serve para apoiar sua autopercepção, ampliar a consciência sobre seu momento e colocar em prática o conteúdo apresentado. Suas respostas ficam apenas neste navegador.</p></div>
  ${nav("go(1)","Começar",false)}`,

escala:()=>{const l=lvl(S.score);return `${folio("Escala")}
  <div class="split"><div style="display:flex;flex-direction:column;gap:20px">
    <div><p class="eyebrow">Passo 1 · Perceba</p><h2 class="h-l">Hoje, quanto <span class="hl">cansaço</span> você sente?</h2></div>
    <p class="lead">Pense nos últimos 7 dias. Não existe resposta certa: é só uma fotografia do seu momento.</p>
    <div class="meter"><span class="num" id="num">${S.score}</span><div class="lab"><strong id="lname">${l.name}</strong><span id="ldesc">${l.desc}</span></div></div>
    <div><label for="score" class="hint">Arraste para marcar de 0 (nenhum cansaço) a 10 (exausto)</label>
    <input type="range" id="score" min="0" max="10" step="1" value="${S.score}" oninput="setScore(this.value)" style="margin-top:10px">
    <div class="ticks">${[...Array(11).keys()].map(i=>`<span>${i}</span>`).join("")}</div></div>
    <div class="legend" id="legend">${LEVELS.map((x,i)=>`<div class="${x===l?"on":""}"><b>${i===0?0:LEVELS[i-1].max+1}–${x.max} · ${x.name}</b>${x.desc}</div>`).join("")}</div>
  </div><img class="side-img" src="${IMG.boia}" alt="Boia com um livro aberto flutuando no mar"></div>
  ${field("notaEscala","notaEscala","O que mais pesou, ou mais ajudou, para você chegar nessa nota?","Ex.: semana de muitas reuniões, dormi pouco, consegui caminhar no fim de semana…")}
  ${nav("go(2)","Continuar",false)}`},

frente:()=>`${folio("Frente")}
  <div><p class="eyebrow">Passo 2 · Mapa do cansaço</p><h2 class="h-l">Onde o cansaço <span class="hl">mais aparece</span> para você?</h2></div>
  <p class="lead">Sugere-se escolher de 1 a 3 frentes, começando pela mais forte nesta semana. A ordem dos cliques vira a ordem de prioridade: a primeira é a sua frente principal.</p>
  <p class="counter" aria-live="polite"><b>${S.fronts.length}</b> de 3 escolhidas${S.fronts.length?` · principal: ${FRONTS[S.fronts[0]].nome}`:""}</p>
  <div class="fronts">${Object.entries(FRONTS).map(([k,f])=>`
    <button class="front" aria-pressed="${S.fronts.includes(k)}" ${!S.fronts.includes(k)&&S.fronts.length>=3?"disabled":""} onclick="pickFront('${k}')">
      <span class="fh"><span style="display:flex;align-items:center;gap:8px"><span class="sw" style="background:${f.cor}"></span><strong>${f.nome}</strong></span><span class="check">${S.fronts.includes(k)?S.fronts.indexOf(k)+1:""}</span></span>
      <ul>${f.sinais.map(s=>`<li>${s}</li>`).join("")}</ul>
    </button>`).join("")}</div>
  ${field("notaSinais","notaSinais","Que sinais você tem percebido em você? Em que momentos eles aparecem?","Ex.: fico irritado no fim da tarde, esqueço coisas simples depois das reuniões…")}
  ${nav("go(3)","Ver sugestões",!S.fronts.length)}`,

dicas:()=>{const fs=S.fronts.map(k=>FRONTS[k]);const ti=Math.min(S.tab||0,fs.length-1);const k=S.fronts[ti];const f=fs[ti];const l=lvl(S.score);
  const names=fs.map(x=>x.nome.toLowerCase());const joined=names.length>1?names.slice(0,-1).join(", ")+" e "+names[names.length-1]:names[0];
  const mp=S.meuPare[k]||{};
  return `${folio("Sugestões")}
  <div class="banner"><div><p class="eyebrow">Nível ${S.score} (${l.name.toLowerCase()}) · ${fs.length} ${fs.length>1?"frentes":"frente"}</p>
    <h2 class="h-l">Cansaço ${joined}</h2><p>${fs.length>1?"Cada tipo de cansaço pede um descanso diferente. Sugere-se começar pela frente principal e ver as outras nas abas abaixo.":f.frase}</p></div>
    <img src="${IMG.gato2}" alt="Gato dormindo sobre um aquecedor"></div>
  ${S.score>=9?`<div class="alert"><b>Seu nível pede atenção especial</b>Se esse cansaço se mantém há semanas, ou se você sente que não está dando conta, sugere-se conversar com alguém de confiança e procurar apoio profissional (médico ou psicólogo). O RH e o programa de bem-estar da empresa também podem orientar. Em momentos de sofrimento intenso, o CVV atende 24 horas pelo telefone 188.</div>`:S.score>=7?`<div class="alert"><b>Um aviso amigo</b>Cansaço alto e frequente merece cuidado. Se ele persistir mesmo com as pausas, sugere-se buscar um profissional de saúde.</div>`:""}
  ${fs.length>1?`<div class="tabs" role="tablist">${fs.map((x,i)=>`<button class="tab" role="tab" id="tab${i}" aria-selected="${i===ti}" onclick="setTab(${i})"><span class="o">${i+1}</span>${x.nome}${i===0?" · principal":""}</button>`).join("")}</div>`:""}
  <div class="fsec" role="tabpanel">
  <div class="fintro"><p class="eyebrow">Cansaço ${f.nome.toLowerCase()} · descanso possível</p><h3 class="h-m">${f.possivel}</h3>${fs.length>1?`<p class="hint" style="font-size:14.5px">${f.frase}</p>`:""}</div>

  <div class="light"><div class="light-head"><p class="eyebrow">Para começar com leveza</p><h3 class="h-m" style="font-size:19px">Micropausas de 1 a 5 minutos</h3><p class="hint">Quando o dia está corrido, um gesto pequeno já muda o estado. Sugere-se escolher uma e experimentar hoje.</p></div>
  <ul class="light-list">${f.leves.map(x=>`<li>${x}</li>`).join("")}</ul></div>

  <div><h3 class="h-m" style="margin-bottom:4px;font-size:19px">Sugestões para recuperar</h3><p class="hint" style="margin-bottom:12px">Sugere-se experimentar as que fizerem sentido para a sua rotina.</p>
  <ul class="tips">${f.dicas.map(d=>`<li><span class="src">Sugestão · ${d[2]}</span><b>${d[0]}</b><span>${d[1]}</span></li>`).join("")}</ul></div>

  <div><h3 class="h-m" style="margin-bottom:4px;font-size:19px">Sugestão de Protocolo PARE para o cansaço ${f.nome.toLowerCase()}</h3><p class="hint" style="margin-bottom:12px">Um exemplo de como aplicar o PARE. Logo abaixo, você pode escrever o seu.</p>
  <div class="pare">${PL.map((n,i)=>`<div><span class="L">${n[0]}</span><span class="n">${n}</span><span>${f.pare[i]}</span></div>`).join("")}</div></div>

  <div class="reflect"><p class="lbl"><span class="pen" aria-hidden="true">✎</span>Meu PARE para o cansaço ${f.nome.toLowerCase()}</p>
  <div class="mypare">${PL.map((n,i)=>`<label for="mp-${k}-${i}"><span class="L">${n[0]}</span><span>${["Qual cansaço estou percebendo?","Que estímulo ou demanda posso afastar por alguns minutos?","Que prática combina com esse cansaço?","Depois da pausa, o que decido fazer?"][i]}</span><input id="mp-${k}-${i}" type="text" value="${esc(mp[n])}" placeholder="${esc(f.pare[i])}" oninput="setPath('meuPare.${k}.${n}',this.value)"></label>`).join("")}</div>
  <span class="hint">Opcional. Se deixar em branco, seu plano usa a sugestão acima.</span></div>

  ${field("rx-"+k,"reflex."+k,`O que você percebe sobre o seu cansaço ${f.nome.toLowerCase()}? O que já funciona para você?`,"Ex.: percebo que melhoro quando caminho depois do almoço…")}
  ${fs.length>1&&ti<fs.length-1?`<div><button class="btn btn-ghost" style="color:var(--orange);padding-inline:0" onclick="setTab(${ti+1})">Ver sugestões para o cansaço ${fs[ti+1].nome.toLowerCase()} →</button></div>`:""}
  </div>
  <div><h3 class="h-m" style="margin-bottom:6px">Recuperação ou empréstimo?</h3><p class="hint" style="margin-bottom:6px">Lembrete da dinâmica: nem toda pausa devolve energia.</p>
  <div class="pairs">${RE.map(r=>`<div class="pair"><span>${r[0]}</span><span class="tag ${r[1]}">${{R:"Recuperação",E:"Empréstimo",D:"Depende"}[r[1]]}</span><span>${r[2]}</span></div>`).join("")}</div></div>
  ${nav("go(4)","Escolher minhas prioridades",false)}`},

bem:()=>`${folio("Parabéns")}
  <div class="celebrate"><div style="display:flex;flex-direction:column;gap:14px">
    <p class="eyebrow">Nível ${S.score} · ${lvl(S.score).name}</p>
    <h2 class="h-l">Que bom ver você <span class="hl">assim!</span></h2>
    <p class="lead">Você está conseguindo recuperar energia, e isso não é sorte: é uma competência que você vem praticando. Saber parar, escolher pausas que de fato descansam e respeitar os próprios limites faz diferença para você e para quem trabalha ao seu lado.</p>
  </div><img class="side-img" style="aspect-ratio:1" src="${IMG.gato1}" alt="Gato relaxando de roupão com rodelas de pepino nos olhos"></div>
  <div><h3 class="h-m" style="margin-bottom:12px">Sugestões para continuar nesse ritmo</h3>
  <ul class="keep">
    <li><b>Ajudar o próximo</b>Descanso também é coletivo. Perceber quem está sobrecarregado e oferecer apoio.</li>
    <li><b>Manter a saúde em dia</b>Exames, consultas e cuidados preventivos.</li>
    <li><b>Dormir bem</b>O sono continua sendo a base de tudo o que você faz bem.</li>
    <li><b>Movimentar-se</b>Atividade física regular sustenta energia e humor.</li>
    <li><b>Cultivar boas relações</b>Conexões genuínas recarregam. Estar perto de quem faz bem a você.</li>
  </ul></div>
  ${field("notaBem","notaBem","O que tem ajudado você a se sentir bem? Vale registrar para lembrar depois.","Ex.: tenho dormido no mesmo horário, voltei a jogar futebol com os amigos…")}
  <div class="alert" style="background:var(--chip)"><b>Lembrete do mapa do cansaço</b>Estar bem hoje não exige vigilância constante. Basta perceber cedo quando os sinais aparecem e usar o Protocolo PARE.</div>
  ${nav("go(3)","Escolher hábitos para manter",false)}`,

prioridades:()=>{const fs=good()?[]:S.fronts.map(k=>FRONTS[k]);
  const groups=good()?[["Hábitos para manter",MANTER,false],["Gestos simples do dia a dia",MANTER_LEVE,false]]:[
    ...fs.map((f,i)=>[`Para o cansaço ${f.nome.toLowerCase()}${fs.length>1&&i===0?" · frente principal":""}`,[...f.leves.slice(0,2),...f.rec],true]),
    ["Tirar, não adicionar",PARAR,false],["Cuidar do básico",BASICOS,false]];
  const full=S.prios.length>=3;
  const chip=(o,rec)=>{const on=S.prios.includes(o);return `<button class="chip ${rec?"rec":""}" aria-pressed="${on}" ${!on&&full?"disabled":""} data-o="${esc(o)}" onclick="togglePrio(this.dataset.o)">${esc(o)}</button>`};
  return `${folio("Prioridades")}
  <div><p class="eyebrow">Passo ${good()?"3":"4"} · Escolha</p><h2 class="h-l">Escolha <span class="hl">3 pontos</span> de descanso para os próximos dias</h2></div>
  <p class="lead">${good()?"Sugere-se escolher três hábitos que você quer proteger para seguir bem. Também pode escrever os seus.":"Sugere-se começar pequeno: três ações específicas e realizáveis valem mais que uma lista longa. As de borda tracejada combinam com as frentes que você escolheu, e as primeiras de cada grupo são as mais leves. Você também pode escrever as suas."}</p>
  <p class="counter" aria-live="polite"><b>${S.prios.length}</b> de 3 escolhidas</p>
  <div class="opts">${groups.map(([t,arr,rec])=>`<div class="opt-group"><h3>${t}</h3><div class="chips">${arr.map(o=>chip(o,rec)).join("")}</div></div>`).join("")}
  <div class="opt-group"><h3>Com as minhas palavras</h3>
    ${S.custom.length?`<div class="chips" style="margin-bottom:10px">${S.custom.map(o=>chip(o,false)).join("")}</div>`:""}
    <form class="addrow" onsubmit="addCustom(event)"><label for="custom" class="sr">Escrever uma prioridade própria</label><input id="custom" type="text" maxlength="90" placeholder="Ex.: Almoçar fora da mesa de trabalho às sextas"><button class="btn btn-dark" type="submit">Adicionar</button></form>
  </div></div>
  <div><label for="parar" class="h-m" style="display:block;margin-bottom:8px">“Nesta semana, eu vou parar de…”</label>
  <textarea id="parar" placeholder="Escreva uma ação específica e realizável. Ex.: abrir o e-mail antes do café da manhã" oninput="S.parar=this.value;save()">${esc(S.parar)}</textarea>
  <p class="hint" style="margin-top:6px">Opcional. Descanso não é mais uma tarefa na lista: é condição para você conseguir realizá-la.</p></div>
  ${nav("go(S.step+1)","Montar meu plano",!full)}`},

plano:()=>{const fs=good()?[]:S.fronts.map(k=>FRONTS[k]);const f=fs[0]||null;const k0=S.fronts[0];const l=lvl(S.score);
  const mp=f?(S.meuPare[k0]||{}):{};const pare=f?PL.map((n,i)=>has(mp[n])?mp[n]:f.pare[i]):[];const own=f&&PL.some(n=>has(mp[n]));
  const notes=[[good()?"O que tem me ajudado":"O que pesou na minha nota",good()?S.notaBem:S.notaEscala],...(good()?[]:[["Sinais que percebo",S.notaSinais],...S.fronts.map(k=>[`Sobre o cansaço ${FRONTS[k].nome.toLowerCase()}`,S.reflex[k]])])].filter(x=>has(x[1]));
  return `${folio("Meu plano")}
  <div class="plan">
    <div class="plan-head" style="background-image:url(${IMG.barco})"><p class="eyebrow">Meu plano de descanso</p><h2 class="h-l">${good()?"Seguir bem, com intenção":"Recuperar o que a rotina tirou"}</h2></div>
    <div class="plan-body">
      <div><p class="k">Escala de cansaço</p><p class="v">${S.score} de 10<small>${l.name} · ${l.desc}</small></p></div>
      ${f?`<div><p class="k">${fs.length>1?"Frentes de cansaço":"Frente de cansaço"}</p><ol class="flist">${fs.map((x,i)=>`<li><b>${x.nome}</b>${i===0&&fs.length>1?"<span class='hint'>(principal)</span>":""}<br><span class="hint">Descanso possível: ${x.possivel}</span></li>`).join("")}</ol></div>`:`<div><p class="k">Momento</p><p class="v">Energia em dia<small>Continue cuidando do básico e das pessoas</small></p></div>`}
      <div style="grid-column:1/-1"><p class="k">Minhas 3 prioridades</p><ol class="prio">${S.prios.map(p=>`<li>${esc(p)}</li>`).join("")}</ol></div>
      ${has(S.parar)?`<div style="grid-column:1/-1"><p class="k">Nesta semana, eu vou parar de…</p><p style="font-size:16px">${esc(S.parar)}</p></div>`:""}
      ${f?`<div style="grid-column:1/-1"><p class="k">${own?"Meu PARE":"Sugestão de PARE"} · cansaço ${f.nome.toLowerCase()}</p><p style="font-size:14px">${PL.map((n,i)=>`<b>${n}:</b> ${esc(pare[i])}`).join(" ")}</p></div>`:""}
      ${notes.length?`<div style="grid-column:1/-1" class="notes"><p class="k">Minhas percepções</p>${notes.map(n=>`<p><b>${n[0]}:</b> ${esc(n[1])}</p>`).join("")}</div>`:""}
    </div>
  </div>
  <p class="quote">Descansar não é abandonar a responsabilidade. É recuperar presença, clareza e a capacidade de continuar.</p>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-dark" onclick="copyPlan()">Copiar meu plano</button><button class="btn btn-ghost" onclick="restart()">Refazer o livreto</button></div>
  <textarea class="copybox" id="copybox" readonly hidden aria-label="Texto do plano para copiar"></textarea>
  <p class="hint">Sugestão: cole o plano no seu bloco de notas ou agenda e revisite no fim da semana. Perceba o que mudou na sua escala.</p>
  <div class="nav"><button class="btn btn-ghost" onclick="go(S.step-1)">← Voltar</button><span class="hint">NBB · Sophia &amp; Natálie · Programa Bem-Estar Zoetis</span></div>`}
};

function setScore(v){if((S.score<=2)!==(+v<=2))S.prios=[];S.score=+v;save();const l=lvl(S.score);$("num").textContent=v;$("lname").textContent=l.name;$("ldesc").textContent=l.desc;
  [...$("legend").children].forEach((d,i)=>d.classList.toggle("on",LEVELS[i]===l));renderSteps()}
function keepScroll(fn){const y=window.scrollY;fn();window.scrollTo(0,y)}
function pickFront(k){const i=S.fronts.indexOf(k);if(i>=0)S.fronts.splice(i,1);else if(S.fronts.length<3)S.fronts.push(k);S.prios=S.prios.filter(p=>S.custom.includes(p));S.tab=0;save();keepScroll(()=>render(false))}
function setTab(i){S.tab=i;save();render(false);const el=$("tab"+i);if(el){el.focus();el.scrollIntoView({block:"nearest",behavior:"smooth"})}}
function togglePrio(o){const i=S.prios.indexOf(o);if(i>=0)S.prios.splice(i,1);else if(S.prios.length<3)S.prios.push(o);save();keepScroll(()=>render(false))}
function addCustom(e){e.preventDefault();const inp=$("custom");const v=inp.value.trim();if(!v)return;
  if(!S.custom.includes(v))S.custom.push(v);if(!S.prios.includes(v)&&S.prios.length<3)S.prios.push(v);else if(S.prios.length>=3)toast("Você já tem 3 escolhidas. Desmarque uma para incluir esta.");
  save();keepScroll(()=>render(false));const n=$("custom");if(n)n.focus()}
function restart(){S=BLANK();save();render()}
function planText(){const fs=good()?[]:S.fronts.map(k=>FRONTS[k]);const f=fs[0]||null;const k0=S.fronts[0];const l=lvl(S.score);
  const mp=f?(S.meuPare[k0]||{}):{};const pare=f?PL.map((n,i)=>has(mp[n])?mp[n].trim():f.pare[i]):[];
  const out=["MEU PLANO DE DESCANSO · Programa Bem-Estar Zoetis (NBB)","",`Escala de cansaço: ${S.score}/10 (${l.name})`];
  if(f){out.push("Frentes de cansaço:");fs.forEach((x,i)=>out.push(`- ${x.nome}${i===0&&fs.length>1?" (principal)":""} · descanso possível: ${x.possivel}`))}else out.push("Momento: energia em dia");
  out.push("","Minhas 3 prioridades:",...S.prios.map((p,i)=>`${i+1}. ${p}`));
  if(has(S.parar))out.push("",`Nesta semana, eu vou parar de: ${S.parar.trim()}`);
  if(f)out.push("",`PARE (${f.nome.toLowerCase()}) · `+PL.map((n,i)=>`${n}: ${pare[i]}`).join(" | "));
  const notes=good()?[["O que tem me ajudado",S.notaBem]]:[["O que pesou na minha nota",S.notaEscala],["Sinais que percebo",S.notaSinais],...S.fronts.map(k=>[`Sobre o cansaço ${FRONTS[k].nome.toLowerCase()}`,S.reflex[k]])];
  const n2=notes.filter(x=>has(x[1]));if(n2.length){out.push("","Minhas percepções:");n2.forEach(x=>out.push(`- ${x[0]}: ${x[1].trim()}`))}
  out.push("","Descansar não é abandonar a responsabilidade.");return out.join("\n")}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
function copyPlan(){const t=planText();const fb=()=>{const b=$("copybox");b.value=t;b.hidden=false;b.focus();b.select();toast("Texto selecionado. Copie com Ctrl+C ou toque longo.")};
  try{navigator.clipboard.writeText(t).then(()=>toast("Plano copiado"),fb)}catch(e){fb()}}
function renderSteps(){const f=flow();$("steps").innerHTML=f.map((_,i)=>`<li class="${i<S.step?"done":i===S.step?"now":""}"></li>`).join("")}
function render(anim=true){const f=flow();if(S.step>=f.length)S.step=f.length-1;
  if(f[S.step]==="dicas"&&!S.fronts.length)S.step=2;
  if(f[S.step]==="plano"&&S.prios.length<3)S.step=f.indexOf("prioridades");
  const p=$("page");p.innerHTML=V[f[S.step]]();if(anim){p.style.animation="none";p.offsetHeight;p.style.animation=""}renderSteps()}
render();

</script>
